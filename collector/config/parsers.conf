[PARSER]
    Name         pihole
    Format       regex
    Regex        ^(?<timestamp>[^ ]+ [^ ]+) dnsmasq\[(?<pid>\d+)\]: (?<action>query|reply|forwarded|cached)\[(?<query_type>[A-Z]+)\] (?<domain>[^ ]+) from (?<client>[^ ]+)$
    Time_Key     timestamp
    Time_Format  %b %d %H:%M:%S

# syslog RFC3164 for the UniFi firewall path. Two tolerances are load-bearing and
# MUST NOT regress (verified end-to-end against Fluent Bit + unifi_transform.lua):
#   1. timestamp tokens are separated by \s+ (not a single space): RFC3164 pads a
#      single-digit day with a DOUBLE space ("Jul  3"), so real UniFi lines on days
#      1-9 would otherwise NOMATCH and be dropped.
#   2. the ident/message boundary is ":\s*" (colon + ZERO-or-more spaces): a CEF
#      header is "CEF:0|..." with a colon and NO following space, so ident="CEF",
#      message="0|...". A ": " (exactly one space) boundary drops every CEF line —
#      i.e. the entire preferred UniFi SIEM/CEF export path. collector/test/harness.lua
#      models this same ":%s*" split; keep the two in sync.
[PARSER]
    Name         syslog-rfc3164
    Format       regex
    Regex        ^<(?<pri>\d+)>(?<timestamp>\S+\s+\S+\s+\S+) (?<host>[^ ]+) (?<ident>[^ :\[]+)(?:\[(?<pid>\d+)\])?:\s*(?<message>.+)$
    Time_Key     timestamp
    Time_Format  %b %d %H:%M:%S
