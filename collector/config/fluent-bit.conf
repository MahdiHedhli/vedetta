[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# ===========================================================================
# INPUTS
# ===========================================================================

# --- Pi-hole DNS logs (unchanged) ---
[INPUT]
    Name         tail
    Path         /var/log/pihole/pihole.log
    Tag          dns.pihole
    Parser       pihole
    Refresh_Interval 10

# --- Firewall syslog (UniFi CEF + legacy iptables), UDP 5140 ---
# mem_buf_limit bounds collector memory during a WAN-scan flood (Pi-4 first):
# excess is back-pressured/dropped at the input rather than queued to OOM.
#
# SECURITY: this listener is unauthenticated (syslog/UDP has no auth). It binds
# 0.0.0.0 so the collector can receive from the gateway regardless of interface,
# but any host that can reach UDP:5140 could otherwise inject fabricated firewall
# events. Two defenses: (1) the unifi_transform commits to the CEF dialect on any
# CEF:0| line and drops non-Ubiquiti / non-firewall lines instead of laundering
# them through the iptables path; (2) deployments MUST firewall UDP:5140 to accept
# only the UniFi gateway's source IP (host firewall / Docker network / VLAN ACL).
# Prefer binding Listen to the gateway-facing collector IP where the topology
# allows it.
[INPUT]
    Name          syslog
    Tag           firewall.syslog
    Listen        0.0.0.0
    Port          5140
    Mode          udp
    Parser        syslog-rfc3164
    Mem_Buf_Limit 16MB

# ===========================================================================
# FILTERS
# ===========================================================================

# --- Transform Pi-hole logs into Vedetta Event schema (unchanged) ---
[FILTER]
    Name         lua
    Match        dns.pihole
    script       /fluent-bit/etc/pihole_transform.lua
    call         pihole_to_event

# --- Transform UniFi firewall syslog into Vedetta firewall_log events ---
# Dialect detection (CEF vs iptables vs drop), normalization, WAN-inbound
# rollup (15-min window), multicast tagging, malformed-line drop counter.
# Replaces the previous bare `modify` filter for firewall.syslog.
[FILTER]
    Name         lua
    Match        firewall.syslog
    script       /fluent-bit/etc/unifi_transform.lua
    call         unifi_to_event

# --- Throttle firewall throughput (SNR / Pi-4 flood protection, T2.3) ---
# Cap sustained firewall events to ~2,000 per 60s. Excess is sampled (dropped),
# never queued — a WAN scan storm degrades to sampling, not to OOM/SD thrash.
# Runs AFTER the transform so it caps EMITTED events (rollups + individuals),
# not raw lines already absorbed by the rollup.
[FILTER]
    Name         throttle
    Match        firewall.syslog
    Rate         2000
    Window       1
    Interval     60s

# ===========================================================================
# OUTPUT
# ===========================================================================

# --- Forward to Vedetta Core ---
# Optional ingest auth (T2.4 / spec FR-8): when VEDETTA_INGEST_TOKEN is set,
# the templated Header line sends "Authorization: Bearer <token>". When the env
# var is unset, Fluent Bit expands it to an empty string; a blank/space Header
# value is ignored. /ingest is open only while Core has NO tokens; once any token
# exists it requires a valid ingest token. Set VEDETTA_INGEST_TOKEN to a strong
# secret — Core provisions the same value as an ingest-scope token on startup.
[OUTPUT]
    Name             http
    Match            *
    Host             backend
    Port             8080
    URI              /api/v1/ingest
    Format           json
    Json_date_key    timestamp
    Json_date_format iso8601
    Header           Authorization Bearer ${VEDETTA_INGEST_TOKEN}
    Retry_Limit      5
