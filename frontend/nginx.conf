server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to backend (Docker bridge DNS resolves the service name)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback (serves the dashboard HTML documents)
    location / {
        # Clickjacking / MIME-sniffing protection on the dashboard responses
        # (GHSA-69jp parallel path). In production the dashboard is served by
        # THIS nginx, not Core, so the headers must live here too. `always` so
        # they are emitted on error responses as well.
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;

        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
