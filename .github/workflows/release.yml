name: Release

# Publishes checksummed, per-OS/arch sensor binaries for install.sh to download.
#
# Note on tooling: the sensor links libpcap via cgo, so it CANNOT be cleanly
# cross-compiled (GoReleaser OSS can't merge multi-runner cgo builds). Instead we
# build each target NATIVELY on its own runner (amd64 + arm64), then assemble a
# single DRAFT release + checksums. The release is always a draft — a human
# reviews and publishes it. Nothing here runs until a `v*` tag is pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag) to build"
        required: true

permissions:
  contents: write # create the draft release

jobs:
  build-sensor:
    name: build sensor (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: sensor/go.sum
      - name: Install libpcap (cgo dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev
      - name: Build + package
        working-directory: sensor
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # The tag being released: github.ref_name on a tag push (e.g. v1.2.3),
          # or the workflow_dispatch ref input for a manual run.
          VERSION: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          # Stamp the version into the binary per the build-version contract:
          # `var buildVersion = "dev"` in package main, overridden at link time.
          go build -trimpath \
            -ldflags="-s -w -X main.buildVersion=${VERSION}" \
            -o vedetta-sensor ./cmd/vedetta-sensor
          # Assert the built binary actually reports the tag — a mismatch means the
          # ldflags path silently broke (wrong package/var), so fail the job.
          reported="$(./vedetta-sensor --version)"
          echo "binary reports: ${reported}"
          if [ "${reported}" != "vedetta-sensor ${VERSION}" ]; then
            echo "::error::version stamp mismatch: got '${reported}', want 'vedetta-sensor ${VERSION}'"
            exit 1
          fi
          tar -czf "vedetta-sensor_${GOOS}_${GOARCH}.tar.gz" vedetta-sensor
      - uses: actions/upload-artifact@v4
        with:
          name: sensor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sensor/vedetta-sensor_*.tar.gz

  release:
    name: assemble draft release
    needs: build-sensor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (the file install.sh verifies against)
        working-directory: dist
        run: |
          sha256sum vedetta-sensor_*.tar.gz > checksums.txt
          cat checksums.txt
      - name: Create/refresh DRAFT release
        uses: softprops/action-gh-release@v2
        with:
          draft: true # never auto-publish — review and publish by hand
          fail_on_unmatched_files: true
          files: |
            dist/vedetta-sensor_*.tar.gz
            dist/checksums.txt
