name: Release

# Publishes checksummed, per-OS/arch sensor binaries for install.sh / install.ps1.
#
# Note on tooling: the Linux sensor links libpcap via cgo, so it CANNOT be cleanly
# cross-compiled (GoReleaser OSS can't merge multi-runner cgo builds) — each Linux
# target is built NATIVELY on its own runner (amd64 + arm64). The Windows sensor is
# driver-free (DNS via ETW, discovery via native ICMP/ARP), so it builds cgo-free and
# is cross-compiled from an ubuntu runner (no MinGW). We then assemble a single DRAFT
# release + checksums. The release is always a draft — a human reviews and publishes
# it. Nothing here runs until a `v*` tag is pushed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing v* tag name to build (not a branch or commit)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-tag:
    name: validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Require an existing v* tag
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Release ref must be a v-prefixed tag name containing only letters, numbers, dot, underscore, or hyphen"
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${REQUESTED_TAG}" >/dev/null; then
            echo "::error::Tag '${REQUESTED_TAG}' does not exist in ${GITHUB_REPOSITORY}"
            exit 1
          fi
          printf 'tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

  build-sensor:
    name: build sensor (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: "1" }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, cgo: "1" }
          # Windows is cgo-free (ETW + native ICMP/ARP) → cross-compile on ubuntu.
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0" }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Force the validated name into the tag namespace. A same-named branch
          # can never substitute for the release tag.
          ref: refs/tags/${{ needs.validate-tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          # Release runs are rare and privileged. Do not restore a cache written
          # by a lower-trust workflow context.
          cache: false
      - name: Install libpcap (cgo dependency)
        if: matrix.cgo == '1'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev
      - name: Build + package
        working-directory: sensor
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # The validated, existing tag shared by checkout and release assembly.
          VERSION: ${{ needs.validate-tag.outputs.tag }}
        run: |
          bin=vedetta-sensor
          [ "$GOOS" = "windows" ] && bin=vedetta-sensor.exe
          # Stamp the version into the binary per the build-version contract:
          # `var buildVersion = "dev"` in package main, overridden at link time.
          go build -trimpath \
            -ldflags="-s -w -X main.buildVersion=${VERSION}" \
            -o "$bin" ./cmd/vedetta-sensor
          # Assert the built binary reports the tag — a mismatch means the ldflags
          # path silently broke. The Windows .exe can't run on the ubuntu runner
          # (the amd64 Linux job's --version check is the authoritative proof the
          # -X path works); here we assert the tag string is embedded in the binary.
          if [ "$GOOS" = "windows" ]; then
            strings -a "$bin" | grep -qF "${VERSION}" \
              || { echo "::error::version stamp '${VERSION}' not embedded in ${bin}"; exit 1; }
            zip -q "vedetta-sensor_${GOOS}_${GOARCH}.zip" "$bin"
          else
            reported="$(./$bin --version)"
            echo "binary reports: ${reported}"
            if [ "${reported}" != "vedetta-sensor ${VERSION}" ]; then
              echo "::error::version stamp mismatch: got '${reported}', want 'vedetta-sensor ${VERSION}'"
              exit 1
            fi
            tar -czf "vedetta-sensor_${GOOS}_${GOARCH}.tar.gz" "$bin"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sensor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sensor/vedetta-sensor_*.tar.gz
            sensor/vedetta-sensor_*.zip

  release:
    name: assemble draft release
    needs: [validate-tag, build-sensor]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create or refresh the draft release only in this job
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (the file install.sh / install.ps1 verify against)
        working-directory: dist
        run: |
          sha256sum vedetta-sensor_*.tar.gz vedetta-sensor_*.zip > checksums.txt
          cat checksums.txt
      - name: Create/refresh DRAFT release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          draft: true # never auto-publish — review and publish by hand
          fail_on_unmatched_files: true
          files: |
            dist/vedetta-sensor_*.tar.gz
            dist/vedetta-sensor_*.zip
            dist/checksums.txt
