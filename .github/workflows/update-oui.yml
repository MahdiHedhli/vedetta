name: update-oui

# Monthly refresh of the embedded IEEE MA-L (24-bit OUI) vendor table.
# Regenerates backend/internal/fingerprint/data/oui.csv from the authoritative IEEE
# registry, validates the embed still builds, and opens a PR when the table changed.
# It NEVER pushes to main — every update lands through review.

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch: {}

# Least privilege by default; the single job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: update-oui
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the automation branch (never main)
      pull-requests: write # open/refresh the update PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Don't leave the workflow token in .git/config for the whole job; the push
          # step authenticates explicitly with GH_TOKEN right before it pushes.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Regenerate the OUI table
        id: refresh
        run: |
          set +e
          scripts/update-oui.sh
          code=$?
          set -e
          case "$code" in
            0) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            3) echo "changed=false" >> "$GITHUB_OUTPUT"
               echo "OUI table already current — nothing to do." ;;
            *) echo "::error::update-oui.sh failed with exit $code"; exit 1 ;;
          esac

      - name: Validate the embed still builds and passes tests
        if: steps.refresh.outputs.changed == 'true'
        working-directory: backend
        run: |
          go build ./...
          go test ./internal/fingerprint/... -count=1

      - name: Open or refresh the update PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="automation/oui-update"
          FILE="backend/internal/fingerprint/data/oui.csv"
          ROWS="$(( $(wc -l < "$FILE") - 1 ))"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Authenticate the push explicitly (checkout used persist-credentials: false), so
          # the token is introduced only here at the end of the job, not left in .git/config
          # for earlier/added steps to read.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          git checkout -b "$BRANCH"
          git add "$FILE"
          git commit -m "chore(fingerprint): refresh IEEE OUI table (${ROWS} entries)"
          # Automation-owned branch — force is safe and keeps a single open PR.
          git push -f origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open for $BRANCH — force-push refreshed it."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(fingerprint): refresh IEEE OUI table" \
              --body "Automated monthly refresh of the embedded IEEE MA-L OUI table (\`${FILE}\`, ${ROWS} entries) via \`scripts/update-oui.sh\`. The embed build + fingerprint tests passed in this run. Review the vendor diff and merge."
          fi
