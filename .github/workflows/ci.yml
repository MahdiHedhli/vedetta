name: CI

# VED-B1 — build, test, and security-scan every change to main.
# Gate: this workflow must be green before a PR can merge (enable the
# "CI / *" checks in branch protection once this lands).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Go: build + vet + test + vuln scan, per module -------------------------
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend, sensor, telemetry, threat-network]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # 'stable' tracks the latest patched Go, which also ships the fixed
          # standard library — govulncheck's stdlib advisories are cleared by
          # scanning with an up-to-date toolchain rather than by editing code.
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Install libpcap (sensor's gopacket/pcap cgo dependency)
        if: matrix.module == 'sensor'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev
      - run: go build ./...
      - run: go vet ./...
      # staticcheck (issue #38). INFORMATIONAL for now — it is wired here so its
      # findings surface in CI, but it does not yet gate merges because the
      # telemetry module trips SA4000 on a tautological determinism test:
      #   telemetry/internal/transmit/sign_test.go:44
      #     if Sign(secret, in) != Sign(secret, in) { ... }
      #   -> "identical expressions on the left and right side of '!=' (SA4000)"
      # That test lives in application source (telemetry), which is out of scope
      # for the CI/Docker change that introduced this step, so it is NOT edited
      # here. Handoff to the telemetry owner: rewrite the test to assert the
      # signature against a captured expected value (or add a justified
      # `//lint:ignore SA4000 determinism check` directive), then drop the
      # `continue-on-error` below to promote staticcheck to a hard gate.
      - name: staticcheck (informational — see note above)
        continue-on-error: true
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - run: go test ./...
      - name: Build and verify the version-stamped Core container
        if: matrix.module == 'backend'
        working-directory: ${{ github.workspace }}
        run: |
          docker build -f backend/Dockerfile -t vedetta-core-version-test .
          expected="vedetta-core $(cat VERSION)"
          actual="$(docker run --rm vedetta-core-version-test --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Core container version mismatch: got '$actual', want '$expected'"
            exit 1
          fi
      - name: Sensor installer transaction and service-health tests
        if: matrix.module == 'sensor'
        run: bash deploy/install_test.sh
      - name: Compile native ARP readers for supported macOS/BSD targets
        if: matrix.module == 'sensor'
        run: |
          for target in darwin/amd64 freebsd/amd64 netbsd/amd64 openbsd/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            out="/tmp/netscan-${os}-${arch}.test"
            echo "== compile $target ARP reader =="
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go test -c -o "$out" ./internal/netscan
          done
      - name: govulncheck (source mode)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: govulncheck (binary mode — scans the actual compiled artifact)
        run: |
          # Source mode scans call graphs; binary mode scans the COMPILED binary —
          # the same artifact the Docker image ships — so it catches stdlib
          # advisories tied to the build toolchain. This closes the gap where CI
          # only source-scanned and never inspected the shipped binary. Build every
          # main package in the module and scan each one.
          bin="$(go env GOPATH)/bin/govulncheck"
          for dir in $(go list -f '{{if eq .Name "main"}}{{.Dir}}{{end}}' ./...); do
            out="/tmp/vulnscan-$(basename "$dir")"
            CGO_ENABLED=1 go build -o "$out" "$dir"
            echo "== binary govulncheck: $dir =="
            "$bin" -mode=binary "$out"
          done

  # ---- Sensor (Windows): gate the //go:build windows code ---------------------
  # The matrix job above only builds the sensor for Linux, so Windows-tagged files
  # (front_windows.go service handler, capture_windows.go ETW, netscan/passive stubs)
  # were never compiled, vetted, or tested in CI — a go-vet lostcancel regression in
  # the service handler shipped undetected. This job builds/vets/tests the cgo-free
  # Windows binary natively and binary-scans the actual .exe.
  sensor-windows:
    name: sensor (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sensor
    env:
      CGO_ENABLED: "0" # the Windows sensor is driver-free: no cgo, no Npcap, no pcap
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: sensor/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Parse the PowerShell 5.1 installer and enforce ASCII source
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $installer = (Resolve-Path "deploy/install.ps1").Path
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $installer, [ref]$tokens, [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          $nonAscii = [System.IO.File]::ReadAllBytes($installer) | Where-Object { $_ -gt 127 }
          if ($nonAscii.Count -ne 0) {
            Write-Error "deploy/install.ps1 contains non-ASCII bytes"
            exit 1
          }
      - name: Build the release executable
        run: go build -trimpath -ldflags="-s -w" -o vedetta-sensor.exe ./cmd/vedetta-sensor
      - name: Windows installer end-to-end transaction smoke
        shell: powershell
        timeout-minutes: 10
        run: |
          $installer = (Resolve-Path "deploy/install.ps1").Path
          $sensor = (Resolve-Path "vedetta-sensor.exe").Path
          $smoke = (Resolve-Path "deploy/testdata/windows-smoke/run.ps1").Path
          & $smoke -Installer $installer -SensorBinary $sensor
      - name: Assert the Windows build pulls in no pcap (driver-free guarantee)
        shell: bash
        run: |
          # go list -deps is authoritative: it inspects the dependency graph, unlike
          # `go tool nm` which returns "no symbols" on a stripped (-s -w) binary and would
          # pass for the wrong reason. The build is GOOS=windows (native runner) + CGO_ENABLED=0.
          if go list -deps ./cmd/vedetta-sensor | grep -q 'gopacket/pcap'; then
            echo "::error::Windows sensor unexpectedly depends on gopacket/pcap"; exit 1
          fi
          echo "OK: no gopacket/pcap in the Windows dependency graph"
      - name: govulncheck (binary mode on the .exe)
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" -mode=binary vedetta-sensor.exe

  # ---- Frontend: install + audit + build -------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Blocking gate: anything a user actually runs. Production deps must be
      # free of high/critical advisories.
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      # Keep the complete development toolchain visible as well. Production
      # advisories remain the blocking policy above.
      - name: npm audit (all deps, informational)
        run: npm audit || true
      - run: npm test
      - run: npm run build

  # ---- Collector: Lua + Python parser regression guards ----------------------
  collector:
    name: collector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4
      - name: Port configuration and upgrade safety guards
        run: bash scripts/tests/port-config-test.sh
      # BLOCKING: the syslog/CEF parser regex correctness guard is interpreter-
      # version-independent (pure Python) and must always pass.
      - name: syslog/CEF parser regression guard
        working-directory: collector/test
        # test_parser.py lands on main via PR #17 (collector CEF fix). Run it
        # when present so this workflow is correct both before and after #17;
        # once merged it is always present and this is a hard gate.
        run: |
          if [ -f test_parser.py ]; then
            python3 test_parser.py
          else
            echo "::notice::collector/test/test_parser.py not on this ref yet (arrives with PR #17); skipping"
          fi
      # BLOCKING: the Lua transform golden suite. It was previously marked
      # informational on the theory that Lua 5.4 vs 5.5 number/string formatting
      # made 4 golden cases fail — that was a MISDIAGNOSIS. The suite's only
      # float output is `anomaly_score:0.0`, which `tostring` formats identically
      # on 5.4 and 5.5; verified all 14 cases pass under both interpreters. The
      # real cause of the 4 clean-checkout failures (cef/iptables/noise golden +
      # wan_drops rollup) was that the corpus `.log` inputs were gitignored
      # (`*.log`) and untracked, so they were absent on a fresh CI checkout. Those
      # SYNTHETIC fixtures are now tracked (see .gitignore negation + issue #40),
      # so the suite is deterministic on a clean checkout and this is a hard gate.
      - name: Lua transform golden suite
        working-directory: collector/test
        run: lua5.4 run_tests.lua

  # ---- Secret scan: full history (push) + PR diff (pull_request) -------------
  # gitleaks-action@v2 auto-selects its mode by event: a full-history scan on
  # push to main, and a PR-diff scan on pull_request. Both use the reviewed
  # repo-root .gitleaks.toml (issue #38) via GITLEAKS_CONFIG, which extends the
  # default ruleset and allowlists ONLY the known synthetic reporter_secret
  # fixtures — every other rule stays active for both scan modes.
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  # This executes candidate test code on the same read-only runner model as the
  # build jobs above. It catches accidental checker/deployer regressions, but is
  # deliberately NON-AUTHORITATIVE: a candidate can edit these copies. The
  # base-owned pull_request_target inspection is the data-policy trust boundary.
  sanitation-regressions:
    name: sanitation regressions (candidate, non-authoritative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run candidate regression suites
        run: |
          bash scripts/tests/repo-sanitization-test.sh
          bash scripts/tests/deploy-sanitation-test.sh
          bash scripts/tests/trusted-pr-sanitation-test.sh
