name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            backend/go.sum
            sensor/go.sum
            telemetry/go.sum
            threat-network/go.sum

      - name: Install sensor build dependency
        if: matrix.language == 'go'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev

      - name: Build Go modules for CodeQL
        if: matrix.language == 'go'
        run: |
          for module in backend sensor telemetry threat-network; do
            (cd "$module" && go build ./...)
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
