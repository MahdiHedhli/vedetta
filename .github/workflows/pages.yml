name: Deploy Public Site

# This workflow deploys ONLY the contents of the `site/` directory to GitHub Pages.
# It is intentionally scoped to `site/` only:
#   - `site/` = Public website (https://vedettas.com)
#   - `docs/` and root markdown files = GitHub repository documentation (not part of the public site)
#
# This separation keeps the public site lean and prevents unrelated doc changes
# from triggering unnecessary deployments.
#
# Manual deployments are also supported via the "Run workflow" button.

on:
  push:
    branches: [main]
    paths: [site/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
