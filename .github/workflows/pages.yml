name: Deploy Public Site

# This workflow deploys ONLY the contents of the `site/` directory to GitHub Pages.
# It is intentionally scoped to `site/` only:
#   - `site/` = Public website (https://vedettas.com)
#   - `docs/` and root markdown files = GitHub repository documentation (not part of the public site)
#
# This separation keeps the public site lean and prevents unrelated doc changes
# from triggering unnecessary deployments.
#
# Manual deployments are also supported via the "Run workflow" button.

on:
  push:
    branches: [main]
    paths: [site/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
