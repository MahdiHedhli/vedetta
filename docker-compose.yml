# Vedetta — Home Network Security Platform
# Usage: docker compose up
# All services communicate over the internal 'vedetta' network.

services:
  # --- Go API Backend ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vedetta-backend
    # SECURE BY DEFAULT (#39): Core's API carries admin & sensor bearer tokens, so
    # it is published to the host LOOPBACK ONLY — never on the LAN in the clear.
    # To reach Core/the dashboard from another machine, front it with the documented
    # TLS reverse proxy (docs/reverse-proxy.md). Change 127.0.0.1 to 0.0.0.0 ONLY if
    # you knowingly accept plaintext bearer tokens traversing your LAN.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VEDETTA_PORT: "8080"
      # Inside the container, loopback is unreachable through the published port and
      # from sibling services, so Core binds all interfaces WITHIN the isolated
      # 'vedetta' network. Host exposure is governed solely by the loopback port
      # mapping above; siblings reach Core by service name (http://backend:8080).
      VEDETTA_LISTEN_ADDR: "0.0.0.0"
      VEDETTA_DB_PATH: "/data/vedetta.db"
      VEDETTA_FRONTEND_DIR: "/frontend"
      VEDETTA_SCAN_CIDR: "${VEDETTA_SCAN_CIDR:-auto}"
      VEDETTA_SCAN_INTERVAL: "${VEDETTA_SCAN_INTERVAL:-5m}"
      VEDETTA_SCAN_PORTS: "${VEDETTA_SCAN_PORTS:-false}"
      # Single-use first-admin bootstrap code (issue #34/#35). scripts/gen-env.sh
      # writes VEDETTA_SETUP_CODE into .env; Core reads it here to mint the FIRST
      # admin token (presented by the onboarding wizard in the X-Vedetta-Setup-Code
      # header). Without this line the generated code never reaches Core and the
      # wizard's "Create Initial Admin Token" 401s. Leave unset only for a Core
      # you intend to bootstrap from its printed log code instead.
      VEDETTA_SETUP_CODE: "${VEDETTA_SETUP_CODE:-}"
      # Shared with the collector below: Core provisions this as an ingest-scope
      # token on startup so /ingest keeps authenticating once auth turns on.
      VEDETTA_INGEST_TOKEN: "${VEDETTA_INGEST_TOKEN:-}"
      # Shared with the telemetry service below: Core provisions this as a
      # read-scope token on startup so the telemetry reader keeps authenticating
      # against GET /api/v1/events once the read gate turns on (beta-gate B6).
      VEDETTA_CORE_TOKEN: "${VEDETTA_CORE_TOKEN:-}"
      # Telemetry opt-in (issue #37c consent honesty). Core computes the EFFECTIVE
      # opt-in the dashboard reports (GET /api/v1/settings/telemetry) from this same
      # env var whenever no dashboard toggle has been persisted. It MUST be passed
      # here, not only to the telemetry service below: without it Core always sees
      # an empty value and defaults to "on", so the dashboard shows Enabled even
      # when .env set it false and the daemon (which DOES read this var) is off —
      # the two would disagree. Passing the same value keeps the reported state and
      # the daemon's real behavior consistent.
      VEDETTA_TELEMETRY_OPTIN: "${VEDETTA_TELEMETRY_OPTIN:-true}"
      # Pull the public advisory community snapshot into local enrichment. This
      # is the same base URL telemetry contributes to; no credential is sent.
      VEDETTA_THREAT_NETWORK_URL: "${VEDETTA_THREAT_NETWORK_URL:-https://feed.vedettas.com}"
      # Optional offline mode for community-feed downloads. This is independent
      # from telemetry contribution; only exact "false" disables polling.
      VEDETTA_COMMUNITY_FEED_ENABLED: "${VEDETTA_COMMUNITY_FEED_ENABLED:-true}"
      # Optional DNS pollers (all off when their URL is blank). Pi-hole v6 uses
      # session auth: TOKEN is an application password (recommended) or regular
      # password. The same variable remains the static token for a v5 api.php URL.
      VEDETTA_PIHOLE_URL: "${VEDETTA_PIHOLE_URL:-}"
      VEDETTA_PIHOLE_TOKEN: "${VEDETTA_PIHOLE_TOKEN:-}"
      VEDETTA_PIHOLE_INTERVAL: "${VEDETTA_PIHOLE_INTERVAL:-60s}"
      VEDETTA_ADGUARD_URL: "${VEDETTA_ADGUARD_URL:-}"
      VEDETTA_ADGUARD_USER: "${VEDETTA_ADGUARD_USER:-}"
      VEDETTA_ADGUARD_PASS: "${VEDETTA_ADGUARD_PASS:-}"
      VEDETTA_ADGUARD_INTERVAL: "${VEDETTA_ADGUARD_INTERVAL:-60s}"
      # Optional, experimental read-only UniFi REST enrichment. Syslog/CEF ingest
      # does not require these. Prefer a read-only API key over user/password.
      VEDETTA_UNIFI_HOST: "${VEDETTA_UNIFI_HOST:-}"
      VEDETTA_UNIFI_PORT: "${VEDETTA_UNIFI_PORT:-443}"
      VEDETTA_UNIFI_USER: "${VEDETTA_UNIFI_USER:-}"
      VEDETTA_UNIFI_PASS: "${VEDETTA_UNIFI_PASS:-}"
      VEDETTA_UNIFI_API_KEY: "${VEDETTA_UNIFI_API_KEY:-}"
      VEDETTA_UNIFI_TLS_SKIP_VERIFY: "${VEDETTA_UNIFI_TLS_SKIP_VERIFY:-false}"
    # Core receives device data from sensors — no direct network scanning needed.
    volumes:
      - vedetta-data:/data
    networks:
      - vedetta
    depends_on:
      - collector
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --- React + Tailwind Dashboard ---
  frontend:
    build: ./frontend
    container_name: vedetta-frontend
    # Dashboard — loopback-only by default (see the backend note above). Reach it
    # from other machines via the TLS reverse proxy, or knowingly set 0.0.0.0 to
    # serve the dashboard as plaintext HTTP on your LAN.
    ports:
      - "127.0.0.1:${VEDETTA_FRONTEND_PORT:-3107}:3000"
    networks:
      - vedetta
    depends_on:
      - backend
    restart: unless-stopped

  # --- Fluent Bit Log Collector ---
  collector:
    build: ./collector
    container_name: vedetta-collector
    ports:
      - "5140:5140/udp"  # Syslog input for firewalls (UniFi CEF + iptables)
    environment:
      # Ingest credential (spec 001 FR-8/T2.4). /ingest is open only while NO
      # tokens exist; once any token is created (e.g. a sensor registers) a valid
      # ingest token is required. Set VEDETTA_INGEST_TOKEN in .env to any strong
      # secret — Core provisions it as an ingest-scope token on startup and the
      # collector presents the same value. Leave unset only for a Core with no
      # tokens at all.
      VEDETTA_INGEST_TOKEN: "${VEDETTA_INGEST_TOKEN:-}"
    volumes:
      - pihole-logs:/var/log/pihole:ro
    networks:
      - vedetta
    restart: unless-stopped

  # --- Telemetry Daemon (ON by default — opt out with VEDETTA_TELEMETRY_OPTIN=false) ---
  telemetry:
    build: ./telemetry
    container_name: vedetta-telemetry
    environment:
      # On by default (opt-out). Set to exactly "false" to stop all outbound
      # sharing. Contributes privacy-reduced, pseudonymous (NOT anonymous),
      # advisory-only signals — no source IPs/MACs/hostnames ever leave the
      # network, but a stable reporter pseudonym is stored server-side; see
      # PRIVACY.md for the residual model.
      VEDETTA_TELEMETRY_OPTIN: "${VEDETTA_TELEMETRY_OPTIN:-true}"
      # Reports to the public community feed (the central threat-network runs
      # off-node behind the Cloudflare tunnel, not in this compose).
      VEDETTA_THREAT_NETWORK_URL: "${VEDETTA_THREAT_NETWORK_URL:-https://feed.vedettas.com}"
      # Read credential for polling Core's GET /api/v1/events. Core's read
      # endpoints require at least read scope once an admin token exists
      # (beta-gate B6); Core provisions this same value as a read-scope token on
      # startup (see VEDETTA_CORE_TOKEN on the backend service) and telemetry
      # presents it here. Leave unset only for a Core with no admin token.
      VEDETTA_CORE_TOKEN: "${VEDETTA_CORE_TOKEN:-}"
    volumes:
      - vedetta-data:/data:ro
      - telemetry-state:/var/lib/vedetta-telemetry  # persist reporter identity, salt, spool
    networks:
      - vedetta
    depends_on:
      - backend
    restart: unless-stopped

  # --- Central Threat Intelligence Backend (COMMUNITY — normally runs OFF-NODE) ---
  threat-network:
    build: ./threat-network
    container_name: vedetta-threat-network
    # Community service, excluded from the default stack. In production the central
    # threat network runs OFF-NODE (see docs/threat-network-operations.md), not in
    # this compose. Start locally with `docker compose --profile community up`.
    profiles: ["community"]
    # Loopback only — never expose the central feed on the LAN from a local run.
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      THREAT_NETWORK_PORT: "9090"
    volumes:
      - threat-network-data:/data  # persist the service-local SQLite DB
    networks:
      - vedetta
    restart: unless-stopped

volumes:
  vedetta-data:
    driver: local
  pihole-logs:
    driver: local
  telemetry-state:
    driver: local
  threat-network-data:
    driver: local

networks:
  vedetta:
    driver: bridge
